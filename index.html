<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ойка</title>
    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Пример структуры вашей страницы -->
    <h1>Мягкая одежда для самых любимых</h1>
    
    <div id="cartModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;" onclick="handleOverlayClick(event)">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 300px;">
            <h3>Корзина</h3>
            <div id="cart-items"></div>
            <p>Всего товаров: <span id="cart-count">0</span></p>
            <p>Итого: <span id="cart-total">0 грн</span></p>
            <button onclick="checkout()">Оформить заказ</button>
            <button onclick="toggleCartModal(false)">Закрыть</button>
        </div>
    </div>

    <!-- JavaScript логика -->
    <script>
        // Инициализация клиента Supabase (используем глобальный объект библиотеки)
        const SUPABASE_URL = ' ТВОЙ_URL_SUPABASE '; // если у тебя эти ключи прописаны в другом файле или выше, оставь как есть
        const SUPABASE_ANON_KEY = ' ТВОЙ_КЛЮЧ_SUPABASE ';
        
        // Проверяем, если supabase еще не создан глобально, создаем его
        const _supabase = window.supabase.createClient(
            window.supabaseUrl || 'https://твой-проект.supabase.co', 
            window.supabaseKey || 'твой-анонимный-ключ'
        );
        // Если в твоем проекте переменная называется просто supabase, используем её:
        const supabase = window.supabase ? window.supabase : _supabase;

        let cart = [];
        const countSpan = document.getElementById('cart-count');
        const totalSpan = document.getElementById('cart-total');

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;
            cart.forEach(item => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;
            });

            if (countSpan) countSpan.innerText = totalCount;
            if (totalSpan) totalSpan.innerText = totalPrice + ' грн';
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function toggleCartModal(show) {
            const modal = document.getElementById('cartModal');
            if (modal) modal.style.display = show ? 'flex' : 'none';
        }

        function handleOverlayClick(event) {
            if (event.target.id === 'cartModal') {
                toggleCartModal(false);
            }
        }

        // Оформление заказа (сохранение в Supabase)
        async function checkout() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }

            const customerName = prompt('Введите ваше имя для заказа:');
            if (!customerName) return;

            const orderData = {
                customer_name: customerName,
                items: cart,
                total_price: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                created_at: new Date()
            };

            const { error } = await supabase.from('orders').insert([orderData]);

            if (error) {
                alert('Ошибка при оформлении заказа. Попробуйте еще раз.');
                console.error(error);
            } else {
                alert('Заказ успешно оформлен!');
                cart = [];
                updateCartUI();
                toggleCartModal(false);
            }
        }

        // Функция проверки доступа
        async function checkUserAccess() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                
                const addBtn = document.getElementById('add-product-btn');
                const loginBox = document.getElementById('login-box');
                const logoutBox = document.getElementById('logout-box');
                const emailDisplay = document.getElementById('user-email-display');

                if (session) {
                    if (addBtn) addBtn.style.display = 'block';
                    if (loginBox) loginBox.style.display = 'none';
                    if (logoutBox) logoutBox.style.display = 'block';
                    if (emailDisplay) emailDisplay.textContent = session.user.email;
                } else {
                    if (addBtn) addBtn.style.display = 'none';
                    if (loginBox) loginBox.style.display = 'block';
                    if (logoutBox) logoutBox.style.display = 'none';
                }
            } catch (e) {
                console.error("Ошибка проверки сессии:", e);
            }
        }

        // Функция входа в систему
        async function adminLogin() {
            const emailInput = document.getElementById('admin-email');
            const passwordInput = document.getElementById('admin-password');
            
            if (!emailInput || !passwordInput) return;
            
            const email = emailInput.value;
            const password = passwordInput.value;

            if (!email || !password) {
                alert('Введите email и пароль!');
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Ошибка входа: ' + error.message);
            } else {
                alert('Успешный вход!');
                checkUserAccess();
            }
        }

        // Функция выхода из системы
        async function adminLogout() {
            await supabase.auth.signOut();
            alert('Вы вышли из системы');
            checkUserAccess();
            location.reload();
        }

        // Запускаем проверку при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            checkUserAccess();
        });
    </script>
    
    <!-- Панель входа и кнопка добавления -->
    <div style="text-align: center; margin: 30px 0;">
        <div id="login-box">
            <input type="email" id="admin-email" placeholder="Email" style="padding: 8px; margin-right: 5px; border: 1px solid #EBE5DC; border-radius: 6px;">
            <input type="password" id="admin-password" placeholder="Пароль" style="padding: 8px; margin-right: 5px; border: 1px solid #EBE5DC; border-radius: 6px;">
            <button onclick="adminLogin()" style="padding: 8px 15px; background: #8A9A86; color: white; border: none; border-radius: 6px; cursor: pointer;">Войти</button>
        </div>
        
        <div id="logout-box" style="display: none;">
            <span id="user-email-display" style="margin-right: 10px; font-weight: bold; color: #3A403B;"></span>
            <button onclick="adminLogout()" style="padding: 8px 15px; background: #D4A373; color: white; border: none; border-radius: 6px; cursor: pointer;">Выйти</button>
        </div>
        
        <button id="add-product-btn" style="display: none; margin: 15px auto 0 auto; padding: 10px 20px; background: #8A9A86; color: white; border: none; border-radius: 8px; cursor: pointer;" onclick="openModal()">+ Добавить объявление</button>
    </div>

</body>
</html>
