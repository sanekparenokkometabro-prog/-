<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Затишок Kids — Дитячий одяг</title>
    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-primary: #2C3531;
            --text-secondary: #7C8580;
            --accent-color: #8EA89D;
            --accent-hover: #739083;
            --border-color: #E3E0D8;
            --radius: 12px;
            --danger-color: #D97D72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .btn-admin {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-admin:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .hero {
            padding: 40px 0 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin: 40px 0 60px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.04);
        }

        .product-gallery {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #EFECE6;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .product-gallery::-webkit-scrollbar {
            display: none;
        }

        .product-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
            scroll-snap-align: start;
        }

        .product-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: auto;
            margin-bottom: 12px;
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Модальні вікна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 53, 49, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .admin-modal, .detail-modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 10;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            outline: none;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }

        .detail-gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            background: #EFECE6;
            border-radius: 8px;
            padding: 10px;
        }

        .detail-gallery img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }

        .detail-price {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 15px 0;
        }

        .detail-desc {
            color: var(--text-secondary);
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        /* Зум модалка */
        .zoom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .zoom-modal.active { display: flex; }
        .zoom-modal img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <header>
        <div class="container header-flex">
            <a href="#" class="logo">Затишок<span>Kids</span></a>
            <button class="btn-admin" id="open-admin">Адмін-панель</button>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Якісний та зручний одяг для малюків</h1>
            <p>Підібрано з турботою та любов'ю до деталей</p>
        </section>

        <div class="products-grid" id="products-container">
            <div class="no-products">Завантаження товарів...</div>
        </div>
    </div>

    <!-- Модальне вікно введення пароля / адмінки -->
    <div class="modal-overlay" id="admin-modal">
        <div class="admin-modal">
            <button class="close-modal" id="close-admin">&times;</button>
            <h2 style="margin-bottom: 20px;" id="admin-modal-title">Вхід для адміністратора</h2>
            
            <div id="auth-section">
                <div class="form-group">
                    <label for="admin-pass">Введіть пароль доступу</label>
                    <input type="password" id="admin-pass" placeholder="Пароль...">
                </div>
                <button class="btn-submit" id="check-pass-btn">Увійти</button>
            </div>

            <form id="add-product-form" style="display: none;">
                <p style="color: var(--accent-color); margin-bottom: 15px; font-weight: 600;">✓ Доступ дозволено</p>
                <div class="form-group">
                    <label for="title">Назва товару</label>
                    <input type="text" id="title" required placeholder="Наприклад: Комбінезон велюровий">
                </div>

                <div class="form-group">
                    <label for="category">Категорія</label>
                    <select id="category">
                        <option value="Немовлята">Немовлята</option>
                        <option value="Костюми">Костюми</option>
                        <option value="Верхній одяг">Верхній одяг</option>
                        <option value="Взуття">Взуття</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Ціна (грн)</label>
                    <input type="number" id="price" required placeholder="450">
                </div>

                <div class="form-group">
                    <label for="description">Опис</label>
                    <textarea id="description" style="height: 90px;" placeholder="Стан, склад тканини, розмір..."></textarea>
                </div>

                <div class="form-group">
                    <label for="images">Фотографії (можна вибрати кілька)</label>
                    <input type="file" id="images" accept="image/*" multiple>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Опублікувати оголошення</button>
            </form>
        </div>
    </div>

    <!-- Модальне вікно перегляду конкретного оголошення -->
    <div class="modal-overlay" id="detail-modal">
        <div class="detail-modal">
            <button class="close-modal" id="close-detail">&times;</button>
            <span id="detail-category" class="product-category"></span>
            <h2 id="detail-title" style="margin-top: 5px;"></h2>
            <div class="detail-price" id="detail-price"></div>
            <div class="detail-gallery" id="detail-gallery"></div>
            <p class="detail-desc" id="detail-desc"></p>
            <button class="btn-delete" id="delete-btn">Видалити це оголошення</button>
        </div>
    </div>

    <!-- Модальне вікно зуму фото -->
    <div class="zoom-modal" id="zoom-modal">
        <button class="close-modal" id="close-zoom" style="color: white;">&times;</button>
        <img id="zoomed-img" src="" alt="Zoom">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwdidcerlfczccmqioby.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_06UBKOGh2dwXy6WK8VkO4w_wJGn0FfA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_SECRET = '12345'; 
        let isAdminLoggedIn = false;
        let currentProductId = null;

        const modal = document.getElementById('admin-modal');
        document.getElementById('open-admin').addEventListener('click', () => {
            modal.classList.add('active');
            if (isAdminLoggedIn) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('add-product-form').style.display = 'block';
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('add-product-form').style.display = 'none';
                document.getElementById('admin-pass').value = '';
            }
        });
        document.getElementById('close-admin').addEventListener('click', () => modal.classList.remove('active'));

        document.getElementById('check-pass-btn').addEventListener('click', () => {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_SECRET) {
                isAdminLoggedIn = true;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('add-product-form').style.display = 'block';
            } else {
                alert('Невірний пароль доступу!');
            }
        });

        async function loadProducts() {
            const container = document.getElementById('products-container');
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="no-products">Помилка завантаження: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="no-products">Поки що немає жодного оголошення.</div>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                let imgs = parseImages(product.image_url);
                let imagesHtml = '';
                if (imgs.length > 0) {
                    imgs.forEach(url => {
                            if (imgs.length > 0) {
        imgs.forEach(url => {
            imagesHtml += `<img src="${url}" alt="${product.title}" onclick="event.stopPropagation(); openZoom('${url}', '${product.image_url.replace(/'/g, "\\'")}')" style="cursor: pointer;">`;
        });
    } else {
        imagesHtml = `<img src="https://via.placeholder.com/300" alt="No image">`;
                            }          

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-gallery">${imagesHtml}</div>
                    <div class="product-content">
                        <span class="product-category">${product.category}</span>
                        <h3 class="product-title">${product.title}</h3>
                        <div class="product-price">${product.price} грн</div>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(product));
                container.appendChild(card);
            });
        }

        function parseImages(imgField) {
            if (!imgField) return [];
            if (Array.isArray(imgField)) return imgField;
            if (typeof imgField === 'string') {
                try {
                    let parsed = JSON.parse(imgField);
                    if (Array.isArray(parsed)) return parsed;
                    if (typeof parsed === 'string') return [parsed];
                } catch(e) {}
                return imgField.split(',').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
            }
            return [];
        }

        const detailModal = document.getElementById('detail-modal');
        document.getElementById('close-detail').addEventListener('click', () => detailModal.classList.remove('active'));

        function openDetailModal(product) {
            currentProductId = product.id;
            document.getElementById('detail-category').textContent = product.category;
            document.getElementById('detail-title').textContent = product.title;
            document.getElementById('detail-price').textContent = `${product.price} грн`;
            document.getElementById('detail-desc').textContent = product.description || 'Опис відсутній';

            const galleryContainer = document.getElementById('detail-gallery');
            galleryContainer.innerHTML = '';
            let imgs = parseImages(product.image_url);
            
            if (imgs.length === 0) imgs = ['https://via.placeholder.com/300x220?text=No+Photo'];

            imgs.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.addEventListener('click', () => openZoom(url));
                galleryContainer.appendChild(img);
            });

            const deleteBtn = document.getElementById('delete-btn');
            if (isAdminLoggedIn) {
                deleteBtn.style.display = 'block';
            } else {
                deleteBtn.style.display = 'none';
            }

            detailModal.classList.add('active');
        }

        document.getElementById('delete-btn').addEventListener('click', async () => {
            if (!confirm('Ви дійсно хочете видалити це оголошення?')) return;

            const { error } = await supabaseClient
                .from('products')
                .delete()
                .eq('id', currentProductId);

            if (error) {
                alert('Помилка видалення: ' + error.message);
            } else {
                alert('Оголошення успішно видалено!');
                detailModal.classList.remove('active');
                loadProducts();
            }
        });

        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = 'Зберігається...';
            submitBtn.disabled = true;

            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const price = Number(document.getElementById('price').value);
            const description = document.getElementById('description').value;
            const imageFiles = document.getElementById('images').files;

            let uploadedUrls = [];

                        for (let i = 0; i < imageFiles.length; i++) {
                const file = imageFiles[i];
                const fileName = `${Date.now()}_${i}_${file.name}`;
                
                const { error: uploadError } = await supabaseClient.storage
                    .from('images')
                    .upload(fileName, file);

                if (!uploadError) {
                    const { data: publicUrlData } = supabaseClient.storage
                        .from('images')
                        .getPublicUrl(fileName);
                    uploadedUrls.push(publicUrlData.publicUrl);
                } else {
                    alert('Помилка завантаження фото: ' + uploadError.message);
                }
                        }

            const { error: insertError } = await supabaseClient
                .from('products')
                .insert([{ title, category, price, description, image_url: uploadedUrls }]);

            if (insertError) {
                alert('Помилка збереження товару: ' + insertError.message);
                submitBtn.textContent = 'Опублікувати оголошення';
                submitBtn.disabled = false;
            } else {
                alert('Товар успішно додано!');
                modal.classList.remove('active');
                document.getElementById('add-product-form').reset();
                submitBtn.textContent = 'Опублікувати оголошення';
                submitBtn.disabled = false;
                loadProducts();
            }
        });

        const zoomModal = document.getElementById('zoom-modal');
        const zoomedImg = document.getElementById('zoomed-img');
        let currentLightboxImages = [];
let currentLightboxIndex = 0;

function openZoom(imageUrl, allImagesString = '') {
    try {
        if (allImagesString) {
            currentLightboxImages = JSON.parse(allImagesString);
            if (!Array.isArray(currentLightboxImages)) currentLightboxImages = [imageUrl];
        } else {
            currentLightboxImages = [imageUrl];
        }
    } catch (e) {
        currentLightboxImages = [imageUrl];
    }
    
    currentLightboxIndex = currentLightboxImages.indexOf(imageUrl);
    if (currentLightboxIndex === -1) currentLightboxIndex = 0;

    updateZoomModalContent();
    
    const zoomModal = document.getElementById('zoom-modal');
    if (zoomModal) {
        zoomModal.classList.add('active');
    }
}

function updateZoomModalContent() {
    const zoomedImg = document.getElementById('zoomed-img');
    const zoomModal = document.getElementById('zoom-modal');
    if (!zoomedImg || !zoomModal) return;

    zoomedImg.src = currentLightboxImages[currentLightboxIndex];
    zoomedImg.style.transform = 'scale(1)';
    zoomedImg.style.cursor = 'zoom-in';

    let controlsContainer = document.getElementById('zoom-custom-controls');
    if (!controlsContainer) {
        controlsContainer = document.createElement('div');
        controlsContainer.id = 'zoom-custom-controls';
        zoomModal.appendChild(controlsContainer);
    }

    const hasMultiple = currentLightboxImages.length > 1;

    controlsContainer.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000;';
    controlsContainer.innerHTML = `
        <div onclick="document.getElementById('zoom-modal').classList.remove('active')" style="position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: #ff4d4d; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
            <span style="color: #fff; font-size: 28px; font-weight: bold; line-height: 1;">&times;</span>
        </div>

        ${hasMultiple ? `
            <div onclick="prevZoomImage(event)" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto;">
                <span style="color: #fff; font-size: 30px; font-weight: bold; line-height: 1;">&#10094;</span>
            </div>
            <div onclick="nextZoomImage(event)" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto;">
                <span style="color: #fff; font-size: 30px; font-weight: bold; line-height: 1;">&#10095;</span>
            </div>
        ` : ''}
    `;
}

function prevZoomImage(event) {
    event.stopPropagation();
    currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
    updateZoomModalContent();
}

function nextZoomImage(event) {
    event.stopPropagation();
    currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
    updateZoomModalContent();
}
                
        document.getElementById('close-zoom').addEventListener('click', () => zoomModal.classList.remove('active'));
        zoomModal.addEventListener('click', (e) => { if(e.target === zoomModal) zoomModal.classList.remove('active'); });

        loadProducts();
        // Функція для відображення списку товарів з підтримкою прокрутки фотографій
function displayProducts(productsToDisplay) {
    const container = document.getElementById('products-container');
    if (!container) return;
    
    container.innerHTML = '';

    productsToDisplay.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';

        // Формуємо слайдер або список фотографій для прокрутки в картці
        let imagesHtml = '';
        if (product.image_url) {
            let urls = [];
            try {
                urls = JSON.parse(product.image_url);
                if (!Array.isArray(urls)) urls = [product.image_url];
            } catch (e) {
                urls = [product.image_url];
            }

            // Робимо блок із горизонтальною прокруткою для фото в картці
            imagesHtml = `
                <div class="card-images-scroll" style="display: flex; overflow-x: auto; gap: 8px; scroll-snap-type: x mandatory; margin-bottom: 10px; border-radius: 8px;">
                    ${urls.map(url => `
                        <img src="${url}" alt="${product.title}" style="min-width: 100%; height: 200px; object-fit: cover; scroll-snap-align: start; cursor: pointer; border-radius: 8px;" onclick="openLightbox('${url}')">
                    `).join('')}
                </div>
            `;
        }

        card.innerHTML = `
            ${imagesHtml}
            <h3>${product.title}</h3>
            <p class="category">${product.category}</p>
            <p class="price">${product.price} грн</p>
            <p class="description">${product.description}</p>
        `;

        container.appendChild(card);
    });
}

// Функція для відкриття великого перегляду (модалки з прокруткою та зумом)
function openLightbox(imageUrl) {
    let lightbox = document.getElementById('custom-lightbox');
    if (!lightbox) {
        lightbox = document.createElement('div');
        lightbox.id = 'custom-lightbox';
        lightbox.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; overflow: auto; padding: 20px;';
        lightbox.innerHTML = `
            <div style="position: relative; max-width: 100%; max-height: 100%;">
                <span onclick="document.getElementById('custom-lightbox').style.display='none'" style="position: absolute; top: -40px; right: 0; color: #fff; font-size: 35px; cursor: pointer; font-weight: bold;">&times;</span>
                <img id="lightbox-img" src="" style="display: block; max-width: 100%; max-height: 85vh; border-radius: 8px; transition: transform 0.2s ease; cursor: zoom-in;" onclick="toggleZoom(this)">
            </div>
        `;
        document.body.appendChild(lightbox);
    }
    
    document.getElementById('lightbox-img').src = imageUrl;
    lightbox.style.display = 'flex';
}

// Проста функція збільшення при кліку у великому перегляді
function toggleZoom(img) {
    if (img.style.transform === 'scale(1.8)') {
        img.style.transform = 'scale(1)';
        img.style.cursor = 'zoom-in';
    } else {
        img.style.transform = 'scale(1.8)';
        img.style.cursor = 'zoom-out';
    }
}

    </script>
