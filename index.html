<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ойка</title>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FAF9F6;
            color: #3A403B;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #EBE5DC;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        .btn {
            background: #8A9A86;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .cart-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .cart-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 320px;
        }
        .auth-box {
            text-align: center;
            margin-top: 40px;
            background: #EBE5DC;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .auth-box input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 80%;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <h1>Ойка — Мягкая одежда</h1>
        <button class="btn" onclick="toggleCartModal(true)">Корзина (<span id="cart-count">0</span>)</button>
    </header>

    <!-- Основной контент (каталог товаров) -->
    <main style="text-align: center;">
        <h2>Натуральные ткани и абсолютный комфорт</h2>
        <div id="products-list" style="margin: 20px 0;">
            <p>Загрузка товаров...</p>
        </div>

        <!-- Кнопка добавления товара (видна только админу) -->
        <button id="add-product-btn" class="btn" style="display: none; background: #D4A373; margin-top: 20px;" onclick="alert('Открытие формы добавления')">+ Добавить объявление</button>
    </main>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="cart-modal" onclick="handleOverlayClick(event)">
        <div class="cart-content">
            <h3>Корзина</h3>
            <div id="cart-items"><p>Корзина пуста</p></div>
            <p><strong>Итого: <span id="cart-total">0</span> грн</strong></p>
            <button class="btn" onclick="checkout()">Оформить заказ</button>
            <button class="btn" style="background: #ccc; color: #333;" onclick="toggleCartModal(false)">Закрыть</button>
        </div>
    </div>

    <!-- Панель входа для администратора -->
    <div class="auth-box">
        <div id="login-box">
            <h3>Вход для администратора</h3>
            <input type="email" id="admin-email" placeholder="Email"><br>
            <input type="password" id="admin-password" placeholder="Пароль"><br>
            <button class="btn" onclick="adminLogin()">Войти</button>
        </div>
        
        <div id="logout-box" style="display: none;">
            <p>Вы вошли как: <span id="user-email-display" style="font-weight: bold;"></span></p>
            <button class="btn" style="background: #D4A373;" onclick="adminLogout()">Выйти</button>
        </div>
    </div>

    <!-- Логика JavaScript -->
    <script>
        // НАСТРОЙКИ SUPABASE (замени на свои актуальные ключи, если они отличаются)
        const SUPABASE_URL = 'https://zrhjtzdbfyvhgzrjrzef.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; 

        // Инициализация клиента Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cart = [];

        // Обновление интерфейса корзины
        function updateCartUI() {
            const countSpan = document.getElementById('cart-count');
            const totalSpan = document.getElementById('cart-total');
            
            let totalCount = 0;
            let totalPrice = 0;
            
            cart.forEach(item => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;
            });

            if (countSpan) countSpan.innerText = totalCount;
            if (totalSpan) totalSpan.innerText = totalPrice;
        }

        // Управление модальным окном корзины
        function toggleCartModal(show) {
            const modal = document.getElementById('cartModal');
            if (modal) modal.style.display = show ? 'flex' : 'none';
        }

        function handleOverlayClick(event) {
            if (event.target.id === 'cartModal') {
                toggleCartModal(false);
            }
        }

        // Оформление заказа
        async function checkout() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }

            const customerName = prompt('Введите ваше имя для заказа:');
            if (!customerName) return;

            const orderData = {
                customer_name: customerName,
                items: cart,
                total_price: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                created_at: new Date()
            };

            const { error } = await supabase.from('orders').insert([orderData]);

            if (error) {
                alert('Ошибка при оформлении заказа.');
                console.error(error);
            } else {
                alert('Заказ успешно оформлен!');
                cart = [];
                updateCartUI();
                toggleCartModal(false);
            }
        }

        // Проверка авторизации при загрузке
        async function checkUserAccess() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                
                const addBtn = document.getElementById('add-product-btn');
                const loginBox = document.getElementById('login-box');
                const logoutBox = document.getElementById('logout-box');
                const emailDisplay = document.getElementById('user-email-display');

                if (session) {
                    if (addBtn) addBtn.style.display = 'block';
                    if (loginBox) loginBox.style.display = 'none';
                    if (logoutBox) logoutBox.style.display = 'block';
                    if (emailDisplay) emailDisplay.textContent = session.user.email;
                } else {
                    if (addBtn) addBtn.style.display = 'none';
                    if (loginBox) loginBox.style.display = 'block';
                    if (logoutBox) logoutBox.style.display = 'none';
                }
            } catch (e) {
                console.error("Ошибка сессии:", e);
            }
        }

        // Вход администратора
        async function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            if (!email || !password) {
                alert('Введите email и пароль!');
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Ошибка входа: ' + error.message);
            } else {
                alert('Успешный вход!');
                checkUserAccess();
            }
        }

        // Выход администратора
        async function adminLogout() {
            await supabase.auth.signOut();
            alert('Вы вышли из системы');
            checkUserAccess();
            location.reload();
        }

        // Запуск при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            checkUserAccess();
            updateCartUI();
        });
    </script>
</body>
</html>
