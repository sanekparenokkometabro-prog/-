<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ойка — Детская одежда в природном стиле</title>
    <!-- Подключаем библиотеку Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #FBF9F5; /* Теплый молочный фон */
            --card-bg: #FFFFFF;
            --text-color: #3A403B; /* Мягкий темно-оливковый */
            --accent-color: #8A9A86; /* Приглушенный оливковый */
            --accent-hover: #72826F;
            --terracotta: #D4A373; /* Теплый акцент */
            --border-color: #EBE5DC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Шапка */
        <!-- Кнопка добавления объявления (скрыта по умолчанию) -->
<button id="add-product-btn" style="display: none; margin: 20px 0; padding: 10px 20px; background: #8A9A86; color: white; border: none; border-radius: 8px; cursor: pointer;" onclick="openModal()">+ Добавить объявление</button>

<!-- Модальное окно (форма) -->
<div id="product-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <h3 style="margin-top: 0; color: #3A403B;">Новое объявление</h3>
        <input type="text" id="new-title" placeholder="Название товара (например, Боди)" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #EBE5DC; border-radius: 6px; box-sizing: border-box;">
        <input type="number" id="new-price" placeholder="Цена (грн)" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #EBE5DC; border-radius: 6px; box-sizing: border-box;">
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button onclick="closeModal()" style="padding: 8px 15px; background: #ccc; border: none; border-radius: 6px; cursor: pointer;">Отмена</button>
            <button onclick="saveProduct()" style="padding: 8px 15px; background: #8A9A86; color: white; border: none; border-radius: 6px; cursor: pointer;">Сохранить</button>
        </div>
    </div>
</div>
        
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .cart-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .cart-btn:hover {
            border-color: var(--accent-color);
        }

        /* Главный контейнер */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .hero p {
            color: #6B726E;
            font-size: 16px;
        }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }

        .product-image {
            width: 100%;
            height: 220px;
            background-color: #F4F1EA;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #A3A8A2;
            font-size: 14px;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 16px;
            color: var(--terracotta);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .buy-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .buy-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Модальное окно корзины */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: flex-end;
            z-index: 1000;
        }

        .cart-modal {
            background: var(--card-bg);
            width: 400px;
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: -5px 0 25px rgba(0,0,0,0.05);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }

        .cart-total {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .checkout-btn {
            background-color: var(--terracotta);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            transition: opacity 0.2s;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .cart-modal {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 Ойка</div>
        <button class="cart-btn" onclick="toggleCartModal(true)">
            🛒 Корзина (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Мягкая одежда для самых любимых</h1>
        <input type="email" id="admin-email" placeholder="Email" style="padding: 8px; margin-right: 5px; border: 1px solid #EBE5DC; border-radius: 6px;">
        <input type="password" id="admin-password" placeholder="Пароль" style="padding: 8px; margin-right: 5px; border: 1px solid #EBE5DC; border-radius: 6px;">
        <button onclick="adminLogin()" style="padding: 8px 15px; background: #8A9A86; color: white; border: none; border-radius: 6px; cursor: pointer;">Войти</button>
    </div>
    <div id="logout-box" style="display: none;">
        <span id="user-email-display" style="margin-right: 10px; font-weight: bold; color: #3A403B;"></span>
        <button onclick="adminLogout()" style="padding: 8px 15px; background: #D4A373; color: white; border: none; border-radius: 6px; cursor: pointer;">Выйти</button>
    </div>
</div>

<!-- Кнопка добавления (скрыта до входа) -->
<button id="add-product-btn" style="display: none; margin: 20px auto; padding: 10px 20px; background: #8A9A86; color: white; border: none; border-radius: 8px; cursor: pointer;" onclick="openModal()">+ Добавить объявление</button>
            
            <p>Натуральные ткани, спокойные оттенки и абсолютный комфорт</p>
        </section>

        <!-- Сетка товаров подгружается из Supabase -->
        <div class="products-grid" id="products-container">
            <p style="color: #A3A8A2;">Загрузка товаров...</p>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal-overlay" id="cartModal" onclick="handleOverlayClick(event)">
        <div class="cart-modal">
            <div>
                <div class="cart-header">
                    <h2>Ваша корзина</h2>
                    <button class="close-cart" onclick="toggleCartModal(false)">✕</button>
                </div>
                <div class="cart-items" id="cart-items-container">
                    <p style="color: #A3A8A2; text-align: center; margin-top: 40px;">Корзина пуста</p>
                </div>
            </div>
            <div>
                <div class="cart-total">
                    <span>Итого:</span>
                    <span id="cart-total-price">0 грн</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
            </div>
        </div>
    </div>

    <script>
        // НАСТРОЙКИ SUPABASE (замени на свои данные из проекта Supabase)
        const SUPABASE_URL = 'https://hwdidcerlfczccmqioby.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_06UBKOGh2dwXy6WK8VkO4w_wJGn0FfA';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cart = [];

        // Загрузка товаров из базы данных Supabase
        async function fetchProducts() {
            const { data, error } = await _supabase.from('products').select('*');
            const container = document.getElementById('products-container');
            
            if (error) {
                container.innerHTML = '<p style="color: #D4A373;">Не удалось загрузить товары. Проверьте подключение к Supabase.</p>';
                console.error('Ошибка:', error);
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p>В каталоге поки нет товаров.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">${product.image_url ? `<img src="${product.image_url}" style="width:100%; height:100%; object-fit:cover;">` : 'Фото товара'}</div>
                    <div class="product-info">
                        <div>
                            <h3 class="product-title">${product.title}</h3>
                            <div class="product-price">${product.price} грн</div>
                        </div>
                        <button class="buy-btn" onclick='addToCart(${JSON.stringify(product)})'>В корзину</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Логика корзины
        function addToCart(product) {
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            alert(`Товар "${product.title}" добавлен в корзину!`);
        }

        function updateCartUI() {
            const countSpan = document.getElementById('cart-count');
            const itemsContainer = document.getElementById('cart-items-container');
            const totalSpan = document.getElementById('cart-total-price');

            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p style="color: #A3A8A2; text-align: center; margin-top: 40px;">Корзина пуста</p>';
            } else {
                itemsContainer.innerHTML = '';
                cart.forEach(item => {
                    totalCount += item.quantity;
                    totalPrice += item.price * item.quantity;

                    const itemEl = document.createElement('div');
                    itemEl.className = 'cart-item';
                    itemEl.innerHTML = `
                        <div>
                            <strong>${item.title}</strong><br>
                            <small>${item.price} грн × ${item.quantity}</small>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:#D4A373; cursor:pointer;">Удалить</button>
                    `;
                    itemsContainer.appendChild(itemEl);
                });
            }

            countSpan.innerText = totalCount;
            totalSpan.innerText = totalPrice + ' грн';
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function toggleCartModal(show) {
            const modal = document.getElementById('cartModal');
            modal.style.display = show ? 'flex' : 'none';
        }

        function handleOverlayClick(event) {
            if (event.target.id === 'cartModal') {
                toggleCartModal(false);
            }
        }

        // Оформление заказа (сохранение в Supabase)
        async function checkout() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }

            const customerName = prompt('Введите ваше имя для заказа:');
            if (!customerName) return;

            const orderData = {
                customer_name: customerName,
                items: cart,
                total_price: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                created_at: new Date()
            };

            // Отправка заказа в таблицу orders в Supabase
            const { error } = await _supabase.from('orders').insert([orderData]);

            if (error) {
                alert('Ошибка при оформлении заказа. Попробуйте еще раз.');
                console.error(error);
            } else {
                alert(`Спасибо за заказ, ${customerName}! Мы скоро с вами свяжемся.`);
                cart = [];
                updateCartUI();
                toggleCartModal(false);
            }
        }

        // Запускаем загрузку товаров при открытии страницы
        fetchProducts();

    // Открытие модального окна
function openModal() {
    document.getElementById('product-modal').style.display = 'flex';
}

// Закрытие модального окна
function closeModal() {
    document.getElementById('product-modal').style.display = 'none';
}

// Проверка доступа (показывает кнопку только если сессия активна)
async function checkUserAccess() {
    const { data: { session } } = await supabase.auth.getSession();
    const addBtn = document.getElementById('add-product-btn');
    if (session) {
        addBtn.style.display = 'block';
    } else {
        addBtn.style.display = 'none';
    }
}

// Функция отправки товара в базу данных Supabase
async function saveProduct() {
    const title = document.getElementById('new-title').value.trim();
    const price = parseFloat(document.getElementById('new-price').value);

    if (!title || isNaN(price)) {
        alert('Пожалуйста, заполните название и цену!');
        return;
    }

    // Записываем данные в таблицу products
    const { error } = await supabase
        .from('products')
        .insert([{ title: title, price: price }]);

    if (error) {
        alert('Ошибка при сохранении: ' + error.message);
    } else {
        alert('Товар успешно добавлен!');
        closeModal();
        // Очищаем поля формы
        document.getElementById('new-title').value = '';
        document.getElementById('new-price').value = '';
        // Перезагружаем страницу или обновляем список товаров
        location.reload(); 
    }
}

// Запускаем проверку при загрузке страницы
checkUserAccess();

        // Функция входа в систему
async function adminLogin() {
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value.trim();

    if (!email || !password) {
        alert('Введите email и пароль!');
        return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
    });

    if (error) {
        alert('Ошибка входа: ' + error.message);
    } else {
        alert('Успешный вход!');
        checkUserAccess(); // Проверяем доступ и показываем кнопку
    }
}

// Функция выхода из системы
async function adminLogout() {
    await supabase.auth.signOut();
    alert вышли из системы);
    checkUserAccess(); // Скрываем кнопку и форму входа
    location.reload();
}

// Улучшенная проверка сессии (управляет видимостью элементов)
async function checkUserAccess() {
    const { data: { session } } = await supabase.auth.getSession();
    
    const addBtn = document.getElementById('add-product-btn');
    const loginBox = document.getElementById('login-box');
    const logoutBox = document.getElementById('logout-box');
    const emailDisplay = document.getElementById('user-email-display');

    if (session) {
        // Если вошли — показываем кнопку плюсика и кнопку выхода, прячем поля ввода
        if (addBtn) addBtn.style.display = 'block';
        if (loginBox) loginBox.style.display = 'none';
        if (logoutBox) logoutBox.style.display = 'inline-block';
        if (emailDisplay) emailDisplay.textContent = session.user.email;
    } else {
        // Если не вошли — прячем кнопку плюсика, показываем поля для входа
        if (addBtn) addBtn.style.display = 'none';
        if (loginBox) loginBox.style.display = 'block';
        if (logoutBox) logoutBox.style.display = 'none';
    }
}

// Запускаем проверку при загрузке страницы
checkUserAccess();
        
    </script>
    
        <!-- Панель входа и кнопка добавления -->
    <div style="text-align: center; margin: 30px 0;">
        <div id="login-box">
            <input type="email" id="admin-email" placeholder="Email" style="padding: 8px; margin-right: 5px; border: 1px solid #EBE5DC; border-radius: 6px;">
            <input type="password" id="admin-password" placeholder="Пароль" style="padding: 8px; margin-right: 5px; border: 1px solid #EBE5DC; border-radius: 6px;">
            <button onclick="adminLogin()" style="padding: 8px 15px; background: #8A9A86; color: white; border: none; border-radius: 6px; cursor: pointer;">Войти</button>
        </div>
        <div id="logout-box" style="display: none;">
            <span id="user-email-display" style="margin-right: 10px; font-weight: bold; color: #3A403B;"></span>
            <button onclick="adminLogout()" style="padding: 8px 15px; background: #D4A373; color: white; border: none; border-radius: 6px; cursor: pointer;">Выйти</button>
        </div>
        
        <button id="add-product-btn" style="display: none; margin: 15px auto 0 auto; padding: 10px 20px; background: #8A9A86; color: white; border: none; border-radius: 8px; cursor: pointer;" onclick="openModal()">+ Добавить объявление</button>
    </div>

</body>
    
</body>
</html>
